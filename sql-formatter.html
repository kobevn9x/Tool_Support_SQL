<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Data Formatter - Kobe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="lang-switcher">
                <select id="langSelect"></select>
            </div>
            <h1 data-i18n="headerTitle">⚡SQL Data Formatter - Kobe⚡</h1>
            <p data-i18n="headerSubtitle">Fast and efficient SQL data formatting tool</p>
        </header>

        <div class="main-content">
            <div class="card">
                <h2 data-i18n="inputTitle">📝 Dữ liệu đầu vào</h2>
                <textarea id="inputText" data-i18n-placeholder="inputPlaceholder" placeholder="Nhập dữ liệu của bạn vào đây (mỗi giá trị một dòng)..."></textarea>
                <div class="controls">
                    <button class="btn-primary" onclick="convertData()">
                        <span data-i18n="btnConvert">🔄 Chuyển đổi</span>
                    </button>
                    <button class="btn-secondary" onclick="clearInput()">
                        <span data-i18n="btnClear">🗑️ Xóa</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <h2 data-i18n="outputTitle">✨ Kết quả</h2>
                
                <!-- Single output mode -->
                <div id="singleOutputMode">
                    <textarea id="outputText" readonly data-i18n-placeholder="outputPlaceholder" placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
                    <div class="controls">
                        <button class="btn-success" onclick="copyToClipboard()">
                            <span data-i18n="btnCopy">📋 Copy</span>
                        </button>
                        <button class="btn-secondary" onclick="downloadResult()">
                            <span data-i18n="btnDownload">💾 Tải xuống</span>
                        </button>
                    </div>
                </div>

                <!-- Chunked output mode with tabs -->
                <div id="chunkedOutputMode" style="display: none;">
                    <div class="chunk-tabs" id="chunkTabs"></div>
                    <div class="chunk-content">
                        <textarea id="chunkedOutputText" readonly></textarea>
                        <div class="controls">
                            <button class="btn-success" onclick="copyCurrentChunk()">
                                <span data-i18n="btnCopyCurrentBlock">📋 Copy Block hiện tại</span>
                            </button>
                            <button class="btn-primary" onclick="copyAllChunks()">
                                <span data-i18n="btnCopyAllBlocks">📋 Copy TẤT CẢ Blocks</span>
                            </button>
                            <button class="btn-secondary" onclick="downloadResult()">
                                <span data-i18n="btnDownload">💾 Tải xuống</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="lineCount">0</div>
                        <div class="stat-label" data-i18n="statLines">Dòng</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="charCount">0</div>
                        <div class="stat-label" data-i18n="statChars">Ký tự</div>
                    </div>
                    <div class="stat-item" id="chunkCountStat" style="display: none;">
                        <div class="stat-value" id="chunkCount">0</div>
                        <div class="stat-label" data-i18n="statBlocks">Blocks</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="options-panel">
            <h3 data-i18n="optionsTitle">⚙️ Tùy chọn</h3>
            <div class="options-grid">
                <div class="option-item">
                    <input type="checkbox" id="removeEmpty" checked>
                    <label for="removeEmpty" data-i18n="optRemoveEmpty">Xóa dòng trống</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="removeDuplicates">
                    <label for="removeDuplicates" data-i18n="optRemoveDuplicates">Xóa giá trị trùng lặp</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="addQuotes" checked>
                    <label for="addQuotes" data-i18n="optAddQuotes">Thêm dấu ngoặc đơn</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="uppercase">
                    <label for="uppercase" data-i18n="optUppercase">Chuyển HOA</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="lowercase">
                    <label for="lowercase" data-i18n="optLowercase">Chuyển thường</label>
                </div>
                <!-- <div class="option-item">
                    <label for="separator" data-i18n="optSeparator">Ký tự phân cách:</label>
                    <input type="text" id="separator" value="," maxlength="3">
                </div>
                <div class="option-item">
                    <label for="sqlDialect" data-i18n="optSqlDialect">SQL Dialect:</label>
                    <select id="sqlDialect">
                        <option value="standard">Standard SQL</option>
                        <option value="mssql">MS SQL</option>
                        <option value="oracle">Oracle</option>
                    </select>
                </div> -->
                <div class="option-item">
                    <label for="outputFormat" data-i18n="optOutputFormat">Output Format:</label>
                    <select id="outputFormat">
                        <option value="inclause">IN Clause</option>
                        <option value="databyrow">DataByRow</option>
                    </select>
                </div>
                <div class="option-item">
                    <label for="inKeywordCase" data-i18n="optInKeywordCase">"IN" Keyword Case:</label>
                    <select id="inKeywordCase">
                        <option value="upper" data-i18n="optInCaseUpper">Uppercase</option>
                        <option value="lower" data-i18n="optInCaseLower">Lowercase</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="history-panel">
            <h3>
                <span data-i18n="historyTitle">📚 Lịch sử chuyển đổi</span>
                <button class="btn-danger" onclick="clearHistory()" style="padding: 8px 16px; font-size: 12px;">
                    <span data-i18n="btnClearAll">🗑️ Xóa tất cả</span>
                </button>
            </h3>
            <div class="history-list" id="historyList">
                <p style="text-align: center; color: #9ca3af; padding: 40px;" data-i18n="historyEmpty">Chưa có lịch sử nào</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
        <span id="toastMessage"></span>
    </div>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
